spring:
  shardingsphere:
    # Active datasource: dataSource1 (PostgreSQL) or dataSource2 (SQL Server)
    active-datasource: dataSource1
    dataSource1:
      name: dataSource1
      driver-class-name: org.postgresql.Driver
      # PostgreSQL JDBC URL configured for Azure Managed Identity authentication (Azure China 21Vianet)
      # Remember to set the following environment variables before deployment:
      # - PGHOST: PostgreSQL server hostname (Azure PostgreSQL server)
      # - PGPORT: PostgreSQL server port (typically 5432)
      # - PGDATABASE: Database name
      # - MANAGED_IDENTITY_NAME: Name of the Azure Managed Identity
      # - MANAGED_IDENTITY_CLIENT_ID: Client ID of the Azure Managed Identity
      url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?user=${MANAGED_IDENTITY_NAME}&sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&azure.authorityHost=https://login.partner.microsoftonline.cn&azure.scopes=https://ossrdbms-aad.database.chinacloudapi.cn/.default&azure.managedIdentityEnabled=true&azure.clientId=${MANAGED_IDENTITY_CLIENT_ID}
      # Comment out username and password because PostgreSQL now authenticates using managed identity
      # username: testuser
      # password: testpass
      max-life-time: 30000
      connection-timeout: 20000
    dataSource2:
      name: dataSource2
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      url: jdbc:sqlserver://localhost:1433;databaseName=testdb2;encrypt=false
      username: sa
      password: YourStrong@Passw0rd
    props:
      sql-show: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 8080
