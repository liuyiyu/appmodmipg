spring:
  shardingsphere:
    # Active datasource: dataSource1 (PostgreSQL) or dataSource2 (SQL Server)
    active-datasource: dataSource1
    dataSource1:
      name: dataSource1
      driver-class-name: org.postgresql.Driver
      # Updated JDBC URL for Azure PostgreSQL with Managed Identity authentication for Mooncake (21V China)
      # Remember to set the following environment variables:
      # - PGHOST: Azure PostgreSQL server hostname
      # - PGPORT: Azure PostgreSQL server port (typically 5432)
      # - PGDATABASE: Database name
      # - MANAGED_IDENTITY_NAME: Name of the managed identity
      # - MANAGED_IDENTITY_CLIENT_ID: Client ID of the managed identity
      #  For Azure sovereign cloud, add these parameters in the url:
      #   azure.scope
      #       - azure_china: https://ossrdbms-aad.database.chinacloudapi.cn/.default
      #       - azure_germany: https://ossrdbms-aad.database.cloudapi.de/.default
      #       - azure_us_government: https://ossrdbms-aad.database.usgovcloudapi.net/.default
      #       - azure: https://ossrdbms-aad.database.windows.net/.default
      #   azure.authorityHost
      #       - azure_china: https://login.partner.microsoftonline.cn
      #       - azure_germany: https://login.microsoftonline.de
      #       - azure_us_government: https://login.microsoftonline.us
      #       - azure: https://login.microsoftonline.com
      # url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?user=${MANAGED_IDENTITY_NAME}&sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&azure.authorityHost=https://login.partner.microsoftonline.cn&azure.scopes=https://ossrdbms-aad.database.chinacloudapi.cn/.default&azure.managedIdentityEnabled=true&azure.clientId=${MANAGED_IDENTITY_CLIENT_ID}
      url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?user=${SERVICE_PRINCIPAL_NAME}&sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&azure.clientId=${SERVICE_PRINCIPAL_CLIENT_ID}&azure.clientSecret=${SERVICE_PRINCIPAL_CLIENT_SECRET}&azure.tenantId=${SERVICE_PRINCIPAL_TENANT_ID}&https://ossrdbms-aad.database.chinacloudapi.cn/.default&azure.authorityHost=https://login.partner.microsoftonline.cn
      # Comment out username and password because PostgreSQL now authenticates using managed identity
      # username: testuser
      # password: testpass
      max-life-time: 30000
      connection-timeout: 20000
    dataSource2:
      name: dataSource2
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      url: jdbc:sqlserver://localhost:1433;databaseName=testdb2;encrypt=false
      username: sa
      password: YourStrong@Passw0rd
    props:
      sql-show: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 8080
