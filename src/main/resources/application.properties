# Remember to set the values for the environment variables in the URL below
# For Azure sovereign cloud, add these parameters in the url:
#  azure.scopes = (one-of-the-following-values)
#     - azure_china: https://ossrdbms-aad.database.chinacloudapi.cn/.default
#     - azure_germany: https://ossrdbms-aad.database.cloudapi.de/.default
#     - azure_us_government: https://ossrdbms-aad.database.usgovcloudapi.net/.default
#     - azure: https://ossrdbms-aad.database.windows.net/.default
#  azure.authorityHost = (one-of-the-following-values)
#     - azure_china: https://login.partner.microsoftonline.cn
#     - azure_germany: https://login.microsoftonline.de
#     - azure_us_government: https://login.microsoftonline.us
#     - azure: https://login.microsoftonline.com
# Example URL for authentication by Service Principal instead of Managed Identity
# AZURE_MYSQL_CONNECTIONSTRING=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?user=${SERVICE_PRINCIPAL_NAME}&sslMode=REQUIRED&authenticationPlugins=com.azure.identity.extensions.jdbc.mysql.AzureMysqlAuthenticationPlugin&azure.clientId=${SERVICE_PRINCIPAL_CLIENT_ID}&azure.clientSecret=${SERVICE_PRINCIPAL_CLIENT_SECRET}&azure.tenantId=${SERVICE_PRINCIPAL_TENANT_ID}
AZURE_MYSQL_CONNECTIONSTRING=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?user=${MANAGED_IDENTITY_NAME}&sslMode=REQUIRED&authenticationPlugins=com.azure.identity.extensions.jdbc.mysql.AzureMysqlAuthenticationPlugin&azure.managedIdentityEnabled=true&azure.clientId=${MANAGED_IDENTITY_CLIENT_ID}
